<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Ten · listening test</title>
  <style>
    body { font: 16px/1.5 -apple-system, sans-serif; max-width: 560px; margin: 0 auto; padding: 20px; background: #f6f1e8; color: #221d17; }
    @media (prefers-color-scheme: dark) { body { background: #17150f; color: #ede6da; } }
    h1 { font-family: Georgia, serif; font-size: 24px; margin-bottom: 4px; }
    h2 { font-size: 16px; margin: 22px 0 6px; }
    audio { width: 100%; }
    .v { margin: 14px 0; }
    small { opacity: .7; }
  </style>
</head>
<body>
  <h1>Listening test</h1>
  <p id="book"></p>
  <p><small>Try a 1-minute sample of each voice, then play a full book and lock your phone to check it keeps going.</small></p>
  <h2>Voice samples (page 1)</h2>
  <div id="samples"></div>
  <h2>Full book (about 15 minutes)</h2>
  <div id="full"></div>
  <script>
    const LABEL = { "en_US-lessac-high": "Lessac (US, female)", "en_US-ryan-high": "Ryan (US, male)", "en_GB-cori-high": "Cori (UK, female)" };
    fetch("listen-test/meta.json").then((r) => r.json()).then((m) => {
      document.getElementById("book").textContent = `${m.title} by ${m.author}`;
      for (const kind of ["sample", "full"]) {
        document.getElementById(kind === "sample" ? "samples" : "full").innerHTML = m.voices.map((v) =>
          `<div class="v">${LABEL[v] || v}<audio controls preload="none" src="listen-test/${v}-${kind}.mp3"></audio></div>`).join("");
      }
      // Lock-screen title and artwork
      document.querySelectorAll("audio").forEach((a) => a.addEventListener("play", () => {
        document.querySelectorAll("audio").forEach((o) => o !== a && o.pause());
        if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({
          title: m.title, artist: `${m.author} · Daily Ten`, artwork: m.cover ? [{ src: m.cover, sizes: "180x270" }] : [],
        });
      }));
    });
  </script>
</body>
</html>
