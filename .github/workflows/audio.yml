name: Audio

on:
  schedule:
    - cron: "47 */2 * * *"   # every 2 hours; each run records what it can in about 45 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/audio.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.narrate.outputs.changed }}
    steps:
      # Recording stops 50 minutes into the job, leaving time to save and publish
      - run: echo "NARRATE_DEADLINE=$(( $(date +%s) + 50 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Audio lives in the Actions cache rather than the repo: each run restores the last two weeks,
      # records any books not yet narrated, and saves the result for the next run
      - uses: actions/cache/restore@v4
        with:
          path: app/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-

      - name: Record audio
        id: narrate
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install -q piper-tts
          before=$(find app/audio -type f 2>/dev/null | sort | xargs -r md5sum | md5sum)
          python3 -u tools/narrate.py
          after=$(find app/audio -type f | sort | xargs -r md5sum | md5sum)
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          du -sh app/audio

      - if: steps.narrate.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: app/audio
          key: audio-${{ github.run_id }}

      # Publish with the latest days, which may have been written while recording
      - if: steps.narrate.outputs.changed == 'true'
        run: git pull -q --ff-only

      - if: steps.narrate.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
