name: Daily books

on:
  schedule:
    - cron: "17 * * * *"   # hourly: GitHub skips scheduled runs when busy, so try often; a finished day is a quick no-op
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "generate.py", "books.txt", ".github/workflows/books.yml", "!app/days/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: books
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write today's summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 generate.py

      # Each day is committed so it is only generated once and stays in the archive
      - name: Save new days
        id: save
        run: |
          git add app/days
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git commit -m "Books for $(TZ=Australia/Melbourne date +%F)"
            git push
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Recorded audio is kept in the Actions cache by the Audio workflow; publish it alongside the days
      - if: steps.save.outputs.publish == 'true'
        uses: actions/cache/restore@v4
        with:
          path: app/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-

      - if: steps.save.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
